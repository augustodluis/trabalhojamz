name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Diagnostico: mostra versoes e a presenca de jest no runner.
      # Em caso de falha permite identificar rapidamente se e problema
      # de ambiente (versao de Node, registo bloqueado, etc.) ou de
      # um teste concreto.
      - name: Diagnose environment
        run: |
          node -v
          npm -v
          cat package.json

      # Usamos "npm install" em vez de "npm ci" para nao exigir
      # package-lock.json. O projecto nao precisa de dependencias
      # reproduzidas exactamente; apenas de dependencias de teste.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # --verbose imprime o nome de cada teste executado, tornando
      # obvio qual e que falha se algo correr mal. --ci desliga o
      # modo interactivo e --colors=false limpa a saida nos logs.
      - name: Run unit tests
        run: npx jest --config tests/jest.config.js --ci --verbose --colors=false

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [ test ]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # Criamos uma pasta limpa apenas com os ficheiros estaticos a
      # publicar. Assim nao levamos para o site node_modules, testes,
      # coverage, apps-script ou ficheiros markdown de desenvolvimento.
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest service-worker.js \
                robots.txt sitemap.xml assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - id: deployment
        uses: actions/deploy-pages@v4
