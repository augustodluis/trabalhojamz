<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Trabalho Já MZ logo">
  <defs>
    <clipPath id="r"><rect x="8" y="8" width="112" height="112" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <!-- Fundo bandeira de Moçambique: listras horizontais -->
    <rect x="0" y="0" width="128" height="42" fill="#007168"/>
    <rect x="0" y="42" width="128" height="3" fill="#fff"/>
    <rect x="0" y="45" width="128" height="38" fill="#000"/>
    <rect x="0" y="83" width="128" height="3" fill="#fff"/>
    <rect x="0" y="86" width="128" height="42" fill="#FCD116"/>
    <!-- Triângulo vermelho (esquerda) -->
    <polygon points="0,0 60,64 0,128" fill="#CE1126"/>
    <!-- Estrela amarela central sobre o triângulo -->
    <polygon fill="#FCD116" points="20,52 23,60 32,60 25,65 28,73 20,68 12,73 15,65 8,60 17,60"/>
  </g>
  <!-- Inicial "T" da marca -->
  <g fill="#fff" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-weight="800">
    <text x="68" y="78" font-size="42" text-anchor="middle">T</text>
  </g>
  <!-- Borda -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="#000" stroke-opacity=".15" stroke-width="2"/>
</svg>
